<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dashboard 学习日报生成器</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }
        .buttons {
            display: flex;
            gap: 15px;
            margin: 30px 0;
        }
        .btn {
            flex: 1;
            padding: 15px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-daily { background: #3498db; }
        .btn-week { background: #2ecc71; }
        .btn-month { background: #e74c3c; }
        .result {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        .result h2 { color: #34495e; }
        .report-content {
            line-height: 1.8;
            padding: 15px;
            background: #fafafa;
            border-radius: 6px;
            border: 1px solid #eee;
        }
        .report-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 10px 0;
        }
        .report-content th, .report-content td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .report-content th { background: #f0f0f0; }
        .chart-frame {
            width: 100%;
            height: 600px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-top: 15px;
        }
        .loading {
            color: #888;
            font-style: italic;
            padding: 20px;
            text-align: center;
        }
        .error {
            color: #e74c3c;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>📊 dashboard 学习日报生成器</h1>
    <p>选择要生成的报告类型：</p>

    <div class="buttons">
        <button class="btn btn-daily" id="btn-daily" onclick="generate('daily')">生成日报</button>
        <button class="btn btn-week" id="btn-week" onclick="generate('week')">生成周报</button>
        <button class="btn btn-month" id="btn-month" onclick="generate('month')">生成月报</button>
    </div>

    <div id="result" class="result" style="display:none;">
        <h2 id="result-title"></h2>
        <div id="result-body"></div>
    </div>

    <script>
        // 从 URL 参数获取 API Key（如 /?key=dev-key）
        const urlParams = new URLSearchParams(window.location.search);
        const apiKey = urlParams.get('key') || '';

        // 按钮 ID 映射
        const buttonMap = {
            'daily': 'btn-daily',
            'week': 'btn-week',
            'month': 'btn-month'
        };

        async function generate(type) {
            const btn = document.getElementById(buttonMap[type]);
            const resultDiv = document.getElementById('result');
            const titleEl = document.getElementById('result-title');
            const bodyEl = document.getElementById('result-body');

            // 按钮置灰，防止重复点击
            btn.disabled = true;
            btn.textContent = '生成中...';

            // 显示加载提示
            resultDiv.style.display = 'block';
            titleEl.textContent = '正在生成报告，请稍候…';
            bodyEl.innerHTML = '<div class="loading">⏳ 正在生成报告，请稍候…</div>';

            try {
                const resp = await fetch('/generate/' + type + '?key=' + encodeURIComponent(apiKey), { method: 'POST' });
                const data = await resp.json();

                if (data.success) {
                    titleEl.textContent = data.title;
                    bodyEl.innerHTML = data.report_html + data.chart_html;
                } else {
                    titleEl.textContent = '生成失败';
                    bodyEl.innerHTML = '<div class="error">❌ ' + data.error + '</div>';
                }
            } catch (e) {
                titleEl.textContent = '错误';
                bodyEl.innerHTML = '<div class="error">❌ 请求失败: ' + e + '</div>';
            } finally {
                // 恢复按钮
                btn.disabled = false;
                btn.textContent = type === 'daily' ? '生成日报' : type === 'week' ? '生成周报' : '生成月报';
            }
        }
    </script>
</body>
</html>
